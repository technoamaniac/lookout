name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test assembleRelease -PversionName="${GITHUB_REF_NAME#v}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "lookout-${GITHUB_REF_NAME}.apk"
          sha256sum "lookout-${GITHUB_REF_NAME}.apk" > "lookout-${GITHUB_REF_NAME}.apk.sha256"
          # A hyphen in the tag (v1.2.0-rc.1) marks a pre-release
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" "lookout-${GITHUB_REF_NAME}.apk" "lookout-${GITHUB_REF_NAME}.apk.sha256" \
            --generate-notes $pre
