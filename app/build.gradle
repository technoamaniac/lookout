plugins {
    id "com.android.application"
}

// Release version comes from the git tag (-PversionName=1.2.3); local builds are 0.0.0-dev
def semver = (findProperty("versionName") ?: "0.0.0-dev").toString()
def semverMatch = semver =~ /^(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$/
if (!semverMatch.matches()) throw new GradleException("versionName '${semver}' is not a semantic version")
def (major, minor, patch) = (1..3).collect { semverMatch.group(it).toInteger() }
// major*10000 + minor*100 + patch: monotonic only while minor and patch stay below 100
if (minor > 99 || patch > 99) throw new GradleException("versionName '${semver}' needs minor and patch below 100")
def semverCode = Math.max(1, major * 10000 + minor * 100 + patch)

android {
    namespace "dev.aman.lookout"
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "dev.aman.lookout"
        minSdk 28
        targetSdk 34
        versionCode semverCode
        versionName semver
    }

    signingConfigs {
        release {
            def keystore = System.getenv("KEYSTORE_PATH")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("KEYSTORE_PATH")) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation "com.google.android.material:material:1.12.0"
    testImplementation "junit:junit:4.13.2"
}
