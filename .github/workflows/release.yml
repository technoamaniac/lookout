name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

jobs:
  # Runs the tests and Gradle, and with them every plugin and dependency, without the signing key
  # or a token that can write
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17.0.21.1+2"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Build the release from a clean slate, not from caches other workflows wrote
          cache-disabled: true

      # Fails the release when a stable version has no CHANGELOG.md entry. Done here, where the code
      # is checked out; the publish job only receives the finished text.
      - name: Extract release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Test and build unsigned release
        run: ./gradlew test assembleRelease -PversionName="${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  # Only pinned actions, the JDK setup-java installs and tools from the runner image run here: no checkout,
  # so no repository code sees the key
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      # For the provenance attestation: a Sigstore certificate, and storing the attestation
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      # apksigner runs on Java; pin it rather than take whichever JDK the runner image ships. The build job
      # already trusts this JDK with the APK this job signs, so downloading it here adds no new source.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17.0.21.1+2"
          # Fail on a bad Adoptium signature rather than only warn, since this JDK handles the signing key
          verify-signature: true
          # Temurin is fetched from Adoptium without it, so keep this job's writing token from the action
          token: ""

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is not set"; exit 1; }
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Signing with $build_tools"
          # apksigner keeps the alignment it is given, so check the input is aligned first
          "$build_tools/zipalign" -c 4 app-release-unsigned.apk
          # Passwords are read from the environment, never put on the command line
          "$build_tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out "lookout-${GITHUB_REF_NAME}.apk" app-release-unsigned.apk
          rm -f "$keystore"
          "$build_tools/apksigner" verify --verbose --print-certs "lookout-${GITHUB_REF_NAME}.apk"

      # Lets anyone check an APK came from this workflow and commit: gh attestation verify. The
      # .sha256 cannot, since it is published next to the APK it vouches for.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: lookout-${{ github.ref_name }}.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum "lookout-${GITHUB_REF_NAME}.apk" > "lookout-${GITHUB_REF_NAME}.apk.sha256"
          # The changelog entry comes first; --generate-notes appends merged pull requests and the compare link
          # A hyphen in the tag (v1.2.0-rc.1) marks a pre-release
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "lookout-${GITHUB_REF_NAME}.apk" "lookout-${GITHUB_REF_NAME}.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md --generate-notes $pre
