plugins {
    id "com.android.application"
}

// Release version comes from the git tag (-PversionName=1.2.3); local builds are 0.0.0-dev
def semver = (findProperty("versionName") ?: "0.0.0-dev").toString()
def semverMatch = semver =~ /^(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$/
if (!semverMatch.matches()) throw new GradleException("versionName '${semver}' is not a semantic version")
// major*10000 + minor*100 + patch: monotonic as long as minor and patch stay below 100
def semverCode = Math.max(1, semverMatch.group(1).toInteger() * 10000 + semverMatch.group(2).toInteger() * 100 + semverMatch.group(3).toInteger())

android {
    namespace "dev.aman.lookout"
    compileSdk 34

    defaultConfig {
        applicationId "dev.aman.lookout"
        minSdk 28
        targetSdk 34
        versionCode semverCode
        versionName semver
    }

    signingConfigs {
        release {
            def keystore = System.getenv("KEYSTORE_PATH")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("KEYSTORE_PATH")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.android.material:material:1.12.0"
    testImplementation "junit:junit:4.13.2"
}
