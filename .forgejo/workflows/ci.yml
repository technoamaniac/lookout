name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: infra
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      # Plain git clone instead of actions/checkout — avoids pulling in Node.js just to satisfy a JS-based action.
      - name: Checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ github.token }}@codeberg.org/${{ github.repository }}.git" .

      - name: Install JDK and Android SDK
        run: |
          apt-get install -y --no-install-recommends default-jdk-headless curl unzip
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Test and build
        run: ./gradlew --no-daemon test assembleDebug
